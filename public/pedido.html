<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Pedido | CBFlow Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #09090b; color: white; }
        .step-active { color: #10b981; border-color: #10b981; }
        .step-active-bg { background-color: #10b981; }
        .step-pending { color: #52525b; border-color: #52525b; }
        .step-pending-bg { background-color: #52525b; }
        .step-canceled { color: #f87171; border-color: #f87171; }
        .step-canceled-bg { background-color: #f87171; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-lg mt-8 mb-10 text-center">
        <a href="/" class="text-3xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 hover:scale-105 transition-transform inline-block">CBFLOW TECH</a>
        <p class="text-zinc-500 text-sm mt-2 font-medium">Seguimiento de Pedido</p>
    </header>

    <!-- Main Container -->
    <main id="pedido-container" class="w-full max-w-lg bg-zinc-900 border border-zinc-800 rounded-3xl p-6 shadow-2xl relative overflow-hidden">
        
        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-10">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-emerald-500 mb-4"></i>
            <p class="text-zinc-400 animate-pulse">Buscando tu pedido...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden flex-col items-center justify-center py-10 text-center">
            <div class="w-16 h-16 bg-red-950/50 rounded-full flex items-center justify-center mb-4">
                <i class="fa-solid fa-circle-exclamation text-3xl text-red-500"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-2">Pedido no encontrado</h2>
            <p class="text-zinc-400 text-sm mb-6">Asegúrate de que el enlace sea correcto.</p>
            <a href="/" class="bg-zinc-800 hover:bg-zinc-700 text-white px-6 py-2 rounded-xl transition">Volver a la tienda</a>
        </div>

        <!-- Success State -->
        <div id="success" class="hidden">
            <div class="border-b border-zinc-800 pb-4 mb-6">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-xl font-black text-white">Pedido de <span id="pedido-cliente" class="text-emerald-400"></span></h2>
                    <span id="pedido-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-emerald-950/50 text-emerald-400 border border-emerald-900/50"></span>
                </div>
                <p class="text-zinc-500 text-xs mt-1" id="pedido-fecha"></p>
            </div>

            <!-- Progress Bar -->
            <div class="relative py-4 mb-8">
                <!-- Line -->
                <div class="absolute top-1/2 left-0 w-full h-1 bg-zinc-800 -translate-y-1/2 z-0 rounded-full"></div>
                <div id="progress-line" class="absolute top-1/2 left-0 h-1 bg-emerald-500 -translate-y-1/2 z-0 transition-all duration-1000 ease-out rounded-full" style="width: 0%;"></div>
                
                <!-- Steps -->
                <div class="flex justify-between relative z-10">
                    <div class="flex flex-col items-center gap-2">
                        <div id="step-1-icon" class="w-8 h-8 rounded-full border-4 bg-zinc-900 flex items-center justify-center transition-colors duration-500 step-active">
                            <i class="fa-solid fa-receipt text-xs"></i>
                        </div>
                        <span class="text-[10px] font-bold uppercase tracking-wider text-zinc-300">Recibido</span>
                    </div>
                    
                    <div class="flex flex-col items-center gap-2">
                        <div id="step-2-icon" class="w-8 h-8 rounded-full border-4 bg-zinc-900 flex items-center justify-center transition-colors duration-500 step-pending">
                            <i class="fa-solid fa-box-open text-xs"></i>
                        </div>
                        <span class="text-[10px] font-bold uppercase tracking-wider text-zinc-500" id="step-2-text">Preparando</span>
                    </div>
                    
                    <div class="flex flex-col items-center gap-2">
                        <div id="step-3-icon" class="w-8 h-8 rounded-full border-4 bg-zinc-900 flex items-center justify-center transition-colors duration-500 step-pending">
                            <i class="fa-solid fa-truck-fast text-xs"></i>
                        </div>
                        <span class="text-[10px] font-bold uppercase tracking-wider text-zinc-500" id="step-3-text">En Camino</span>
                    </div>
                </div>
            </div>

            <!-- Resumen -->
            <div class="bg-zinc-950/50 rounded-2xl p-4 border border-zinc-800/50">
                <h3 class="text-sm font-bold text-zinc-300 mb-3"><i class="fa-solid fa-bag-shopping mr-2 text-emerald-500"></i>Resumen de compra</h3>
                <div id="pedido-items" class="space-y-3 mb-4">
                    <!-- Items -->
                </div>
                <div class="border-t border-zinc-800 pt-3 flex justify-between items-center">
                    <span class="text-zinc-400 text-sm">Total pagado</span>
                    <span id="pedido-total" class="text-xl font-black text-cyan-400"></span>
                </div>
            </div>

            <div class="mt-6 text-center">
                <a href="/" class="text-emerald-400 hover:text-emerald-300 text-sm font-bold transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Volver a la tienda
                </a>
            </div>
        </div>
    </main>

    <!-- Background Decoration -->
    <div class="fixed top-[-10%] left-[-10%] w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl -z-10 pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl -z-10 pointer-events-none"></div>

    <script>
        async function cargarPedido() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                mostrarError();
                return;
            }

            try {
                const response = await fetch(`/api/pedidos/${id}/estado`);
                if (!response.ok) throw new Error('No encontrado');
                const data = await response.json();
                mostrarPedido(data);
            } catch (error) {
                mostrarError();
            }
        }

        function mostrarError() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('success').classList.add('hidden');
        }

        function mostrarPedido(pedido) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('success').classList.remove('hidden');

            document.getElementById('pedido-cliente').textContent = pedido.cliente;
            document.getElementById('pedido-fecha').textContent = new Date(pedido.fecha).toLocaleString('es-CO');
            document.getElementById('pedido-total').textContent = '$' + Number(pedido.total).toLocaleString('es-CO');

            // Badge y Progreso
            const badge = document.getElementById('pedido-badge');
            const progressLine = document.getElementById('progress-line');
            const step2 = document.getElementById('step-2-icon');
            const step3 = document.getElementById('step-3-icon');
            const step2Text = document.getElementById('step-2-text');
            const step3Text = document.getElementById('step-3-text');

            if (pedido.estado === 'pendiente') {
                badge.textContent = 'Recibido';
                badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-amber-950/50 text-amber-400 border border-amber-900/50';
                setTimeout(() => progressLine.style.width = '0%', 100);
            }
            else if (pedido.estado === 'confirmado') {
                badge.textContent = 'Confirmado';
                badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-emerald-950/50 text-emerald-400 border border-emerald-900/50';
                setTimeout(() => progressLine.style.width = '33%', 100);
                step2.classList.remove('step-pending'); step2.classList.add('step-active');
                step2Text.classList.remove('text-zinc-500'); step2Text.classList.add('text-zinc-300');
            }
            else if (pedido.estado === 'preparando') {
                badge.textContent = '📦 Preparando';
                badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-blue-950/50 text-blue-400 border border-blue-900/50';
                setTimeout(() => progressLine.style.width = '50%', 100);
                step2.classList.remove('step-pending'); step2.classList.add('step-active');
                step2Text.classList.remove('text-zinc-500'); step2Text.classList.add('text-zinc-300');
                step2Text.textContent = '¡Preparando!';
            }
            else if (pedido.estado === 'en_camino') {
                badge.textContent = '🚚 En Camino';
                badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-purple-950/50 text-purple-400 border border-purple-900/50';
                setTimeout(() => progressLine.style.width = '80%', 100);
                step2.classList.remove('step-pending'); step2.classList.add('step-active');
                step3.classList.remove('step-pending'); step3.classList.add('step-active');
                step2Text.classList.remove('text-zinc-500'); step2Text.classList.add('text-zinc-300');
                step3Text.classList.remove('text-zinc-500'); step3Text.classList.add('text-zinc-300');
                step3Text.textContent = '¡En Camino!';
            }
            else if (pedido.estado === 'entregado') {
                badge.textContent = '✨ Entregado';
                badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-emerald-950/50 text-emerald-400 border border-emerald-900/50';
                setTimeout(() => progressLine.style.width = '100%', 100);
                step2.classList.remove('step-pending'); step2.classList.add('step-active');
                step3.classList.remove('step-pending'); step3.classList.add('step-active');
                step2Text.classList.remove('text-zinc-500'); step2Text.classList.add('text-zinc-300');
                step3Text.classList.remove('text-zinc-500'); step3Text.classList.add('text-zinc-300');
                step3Text.textContent = '¡Entregado!';
            }
            else if (pedido.estado === 'cancelado') {
                badge.textContent = 'Cancelado';
                badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-red-950/50 text-red-400 border border-red-900/50';
                setTimeout(() => {
                    progressLine.style.width = '100%';
                    progressLine.classList.replace('bg-emerald-500', 'bg-red-500');
                }, 100);
                step2.classList.replace('step-pending', 'step-canceled');
                step3.classList.replace('step-pending', 'step-canceled');
                step2.innerHTML = '<i class="fa-solid fa-xmark text-xs"></i>';
                step3.innerHTML = '<i class="fa-solid fa-xmark text-xs"></i>';
                step2Text.textContent = 'Cancelado';
                step3Text.textContent = 'Cancelado';
                step2Text.className = 'text-[10px] font-bold uppercase tracking-wider text-red-500';
                step3Text.className = 'text-[10px] font-bold uppercase tracking-wider text-red-500';
            }

            // Items
            let itemsArray = [];
            try {
                itemsArray = typeof pedido.items === 'string' ? JSON.parse(pedido.items) : pedido.items;
            } catch(e) {}

            const itemsHtml = itemsArray.map(item => `
                <div class="flex justify-between text-sm">
                    <span class="text-zinc-300"><span class="text-zinc-500">${item.cantidad}x</span> ${item.nombre} <span class="text-zinc-500 text-xs">(${item.sabor || 'Original'})</span></span>
                </div>
            `).join('');
            
            document.getElementById('pedido-items').innerHTML = itemsHtml;
        }

        window.onload = cargarPedido;
    </script>
</body>
</html>
